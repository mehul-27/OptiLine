[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optiline"
version = "0.0.0"
description = "Browser-based 2D vehicle-dynamics and racing-line optimisation simulator."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "scipy>=1.18.1",
    "shapely>=2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-shapely>=2.1.0.20261030",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optiline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
